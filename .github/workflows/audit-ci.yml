name: Pre-release audit checks (no deployment)
on:
  push:
    branches:
      - 'audit/**'
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate missing lockfile on audit branch only
        if: github.event_name == 'push' && github.ref == 'refs/heads/audit/camera-performance-pre-release'
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'Lock ScanDeck npm dependency versions'
            git push origin HEAD:audit/camera-performance-pre-release
          fi
      - name: Install from lockfile
        run: npm ci --no-audit --no-fund
      - name: Audit dependency security
        run: npm audit --audit-level=high
      - name: Build all barcode assets
        run: npm run build
      - name: Verify JavaScript syntax
        run: |
          for file in src/*.js tools/*.mjs; do node --check "$file"; done
      - name: Run full test suite
        run: npm test
      - name: Verify static deployment assets
        run: node tools/prepare-cloudflare.mjs
