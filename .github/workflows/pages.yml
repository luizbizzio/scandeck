name: Build and publish ScanDeck
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: scandeck-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out files
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build all game codes and scanner
        run: npm run build
      - name: Validate browser JavaScript
        run: |
          node --check src/app.js
          node --check src/scanner-geometry.js
          node --check src/barcode-worker.js
          node --check src/protocol.js
          node --check src/runtime.js
          node --check src/microvm.js
          node --check tools/build-matrix.mjs
          node --check src/chroma.js
          node --check src/iris-worker.js
          node --check src/exotic-worker.js
          node --check tools/build-exotic.mjs
          node --check tools/build-code-sizes.mjs
          node --check sw.js
      - name: Run tests
        run: npm test
      - name: Prepare static site
        run: |
          mkdir -p dist/assets dist/vendor/zxing-wasm dist/src
          cp index.html sw.js .nojekyll CNAME robots.txt sitemap.xml dist/
          cp src/*.js src/style.css dist/src/
          node tools/inject-code-sizes.mjs dist/index.html
          mkdir -p dist/vendor/iris
          cp vendor/iris/*.js vendor/iris/LICENSE dist/vendor/iris/
          cp assets/*.svg assets/*.png assets/*.txt assets/*.json dist/assets/
          cp vendor/zxing-wasm/index.js vendor/zxing-wasm/zxing_full.wasm dist/vendor/zxing-wasm/
          cp vendor/qrcode-generator.js vendor/sythos-barcode.esm.js vendor/sythos.LICENSE dist/vendor/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Wait for artifact indexing
        run: sleep 15
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
