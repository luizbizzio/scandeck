<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><body style="margin:0;min-height:100dvh;display:grid;place-items:center;background:#09120e;color:#c9f5b2;font:17px system-ui"><canvas id=c width=280 height=430 style="width:min(90vw,280px);max-height:85dvh;touch-action:manipulation;background:#122219;border:1px solid #365640;border-radius:14px"></canvas><script>
