<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#0c1110;color:#d5f9bc;text-align:center;font:20px system-ui}main{margin:20px auto;display:grid;grid-template-columns:repeat(2,100px);gap:12px;justify-content:center}button{height:100px;border:0;border-radius:14px;touch-action:manipulation}</style><h2>PATTERN MEMORY</h2><p id=s>Watch</p><main id=g><button style="background:#ee6659"></button><button style="background:#69c778"></button><button style="background:#669ce2"></button><button style="background:#e8c15e"></button></main><script>p=[],i=0,ready=0;flash=j=>{g.children[j].style.opacity=.2;setTimeout(()=>g.children[j].style.opacity=1,260)};next=()=>{ready=0;i=0;p.push(Math.random()*4|0);s.textContent='WATCH';p.forEach((n,k)=>setTimeout(()=>flash(n),500+k*520));setTimeout(()=>{s.textContent='REPEAT';ready=1},500+p.length*520)};g.onclick=e=>{if(!ready||e.target.tagName!='BUTTON')return;j=[...g.children].indexOf(e.target);flash(j);if(j!=p[i++]){ready=0;s.textContent='TRY AGAIN';p=[];return setTimeout(next,900)}if(i==p.length){ready=0;if(p.length==5)return s.textContent='YOU WIN';setTimeout(next,700)}};next()</script>
