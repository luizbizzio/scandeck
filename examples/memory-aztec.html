<meta name=viewport content="width=device-width"><body bgcolor=black text=lime><style>button{width:90px;height:90px}#g{width:200px;display:grid;grid-template-columns:1fr 1fr}</style><h2>PATTERN MEMORY</h2><p id=s>WATCH</p><div id=g><button style="background:red">1</button><button style="background:green">2</button><button style="background:blue">3</button><button style="background:gold">4</button></div><script>p=[],i=0;f=j=>{g.children[j].style.opacity=.2;setTimeout(()=>g.children[j].style.opacity=1,250)};r=()=>{i=0;s.innerText='WATCH';p.push(Math.random()*4|0);p.forEach((j,k)=>setTimeout(()=>f(j),500+k*500));setTimeout(()=>s.innerText='REPEAT',500+p.length*500)};g.onclick=e=>{if(s.innerText!='REPEAT')return;j=[...g.children].indexOf(e.target);f(j);if(j!=p[i++])p=[],s.innerText='LOSE',setTimeout(r,800);else if(i==p.length){s.innerText='NICE';p.length==5?s.innerText='WIN':setTimeout(r,700)}};r()</script>
