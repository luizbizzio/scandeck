<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#0c1110;color:#d5f9bc;text-align:center;font:20px system-ui}main{margin:20px auto;display:grid;grid-template-columns:repeat(2,100px);gap:12px;justify-content:center}button{height:100px;border:0;border-radius:14px;touch-action:manipulation}</style><h2>PATTERN MEMORY</h2><p id=s>Tap a color to start</p><main id=g><button style="background:#ee6659"></button><button style="background:#69c778"></button><button style="background:#669ce2"></button><button style="background:#e8c15e"></button></main><script>p=[],i=0,ready=0,a=0;note=j=>{if(!a||a===1)return;let o=a.createOscillator(),v=a.createGain();o.frequency.value=[262,330,392,523][j];v.gain.value=.08;o.connect(v).connect(a.destination);o.start();o.stop(a.currentTime+.18)};flash=j=>{note(j);g.children[j].style.opacity=.2;setTimeout(()=>g.children[j].style.opacity=1,260)};next=()=>{ready=0;i=0;p.push(Math.random()*4|0);s.textContent='WATCH';p.forEach((n,k)=>setTimeout(()=>flash(n),500+k*520));setTimeout(()=>{s.textContent='REPEAT';ready=1},500+p.length*520)};g.onclick=e=>{if(e.target.tagName!='BUTTON')return;if(a===0){let A=window.AudioContext||window.webkitAudioContext;a=A?new A:1;a.resume&&a.resume();return next()}if(!ready)return;j=[...g.children].indexOf(e.target);flash(j);if(j!=p[i++]){ready=0;s.textContent='TRY AGAIN';p=[];return setTimeout(next,900)}if(i==p.length){ready=0;if(p.length==5)return s.textContent='YOU WIN';s.textContent='NICE';setTimeout(next,700)}}</script>
