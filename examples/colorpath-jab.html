<meta name=viewport content="width=device-width,initial-scale=1"><style>body{margin:0;min-height:100dvh;background:#0b1410;color:#deefdf;font:16px system-ui;display:grid;place-content:center;box-sizing:border-box;padding:16px}article{width:min(350px,90vw);text-align:center}h2{font-size:25px;margin:8px 0;color:#c8f8a5}p{margin:8px 0;color:#b0c3b4;font-size:14px}.stats{display:flex;justify-content:space-between;gap:16px;margin:15px 2px}b{color:#ceffb0}.prompt{background:#14251c;border:1px solid #365542;border-radius:18px;padding:13px;margin:8px 0}.prompt small{font-size:12px;letter-spacing:2px;color:#aac5b1}.prompt strong{display:block;font-size:clamp(38px,11vw,56px);letter-spacing:2px;min-height:67px}#bar{height:8px;background:#27362c;border-radius:8px;overflow:hidden;margin:14px 0}#fill{display:block;height:100%;width:100%;background:#bcf69a}main{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}button{min-height:66px;border:0;border-radius:13px;color:#071109;font-size:16px;font-weight:800;touch-action:manipulation}button:active{transform:scale(.96)}#start{height:44px;min-height:44px;padding:0 36px;background:#c5f8a1}button[data-k="0"]{background:#ed7776}button[data-k="1"]{background:#83d698}button[data-k="2"]{background:#84a9f0}button[data-k="3"]{background:#f2d77e}</style><article><h2>CHROMA RUSH</h2><p>Match the <b>INK COLOR</b>, not the word.</p><div class=stats><span>ROUND <b id=s>0 / 10</b></span><span><b id=l>3</b> LIVES</span></div><div class=prompt><small>WHAT COLOR ARE THE LETTERS?</small><strong id=t>READY</strong></div><div id=bar><i id=fill></i></div><button id=start>START</button><main id=g><button data-k=0>RED</button><button data-k=1>GREEN</button><button data-k=2>BLUE</button><button data-k=3>GOLD</button></main></article><script>C=['RED','GREEN','BLUE','GOLD'];H=['#ed7776','#83d698','#84a9f0','#f2d77e'];n=0;life=3;active=0;timer=0;next=()=>{k=Math.random()*4|0;w=(k+1+(Math.random()*3|0))%4;t.textContent=C[w];t.style.color=H[k];s.textContent=n+' / 10';l.textContent=life;d=3000-n*100;fill.style.transition='none';fill.style.width='100%';fill.offsetWidth;fill.style.transition='width '+d+'ms linear';fill.style.width='0%';timer=setTimeout(()=>answer(0),d)};answer=ok=>{if(!active)return;clearTimeout(timer);ok?n++:life--;if(n==10||!life){active=0;t.style.color='#c8f8a5';t.textContent=n==10?'YOU WIN':'GAME OVER';l.textContent=life;s.textContent=n+' / 10';fill.style.transition='none';fill.style.width='0';start.hidden=false;start.textContent='RETRY';return}next()};start.onclick=()=>{clearTimeout(timer);n=0;life=3;active=1;start.hidden=true;next()};g.onclick=e=>{if(active&&e.target.dataset.k!==undefined)answer(+e.target.dataset.k==k)}</script>
