<meta name=viewport content="width=device-width,initial-scale=1"><style>body{background:#0a100e;color:#e0f8e2;text-align:center;font:18px system-ui;margin:0;padding:14px}h2{margin:8px}h1{font-size:58px;margin:12px 0}p{margin:12px auto;max-width:340px}main{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:310px;margin:16px auto}button{border:0;border-radius:14px;padding:22px 8px;font-weight:800;font-size:17px;touch-action:manipulation}#start{background:#b5f79b;padding:12px 35px}#track{height:9px;background:#26382d;border-radius:8px;overflow:hidden;max-width:310px;margin:auto}#fill{display:block;height:100%;width:100%;background:#b5f79b}</style><h2>CHROMA RUSH</h2><p>Tap the <b>TEXT COLOR</b>, not the word! You have 3 lives.</p><p id=s>0 / 10 | 3 lives</p><h1 id=t>READY</h1><div id=track><i id=fill></i></div><button id=start>START</button><main id=g><button data-k=0 style="background:#f66">RED</button><button data-k=1 style="background:#6e8">GREEN</button><button data-k=2 style="background:#79f">BLUE</button><button data-k=3 style="background:#fd6">GOLD</button></main><script>C=['RED','GREEN','BLUE','GOLD'];H=['#f66','#6e8','#79f','#fd6'];n=0;l=3;run=0;timer=0;next=()=>{w=Math.random()*4|0;k=Math.random()*4|0;t.textContent=C[w];t.style.color=H[k];s.textContent=n+'/10 | '+l+' lives';d=1700-n*60;fill.style.transition='none';fill.style.width='100%';fill.offsetWidth;fill.style.transition='width '+d+'ms linear';fill.style.width='0%';timer=setTimeout(()=>finish(0),d)};finish=ok=>{clearTimeout(timer);ok?n++:l--;if(n==10||l==0){run=0;t.style.color='#b5f79b';t.textContent=n==10?'YOU WIN':'GAME OVER';s.textContent=n+'/10 | '+l+' lives';start.hidden=false;start.textContent='RETRY';return}next()};start.onclick=()=>{n=0;l=3;run=1;start.hidden=true;next()};g.onclick=e=>{if(run&&e.target.dataset.k!==undefined)finish(+e.target.dataset.k==k)}</script>
