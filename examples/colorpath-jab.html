<meta name=viewport content="width=device-width,initial-scale=1"><body style="background:#0a1110;color:#d5f9bc;text-align:center;font:20px system-ui"><style>main{max-width:280px;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:auto}button{height:110px;border:0;border-radius:16px;font-size:23px}#start{height:50px;background:#baf797}</style><h2>CHROMA RUSH</h2><p id=s>12 correct | 3 lives</p><h1 id=t>READY?</h1><button id=start>START</button><main id=g><button data-k=0 style="background:#f36d68">R</button><button data-k=1 style="background:#6ecb79">G</button><button data-k=2 style="background:#69a9e9">B</button><button data-k=3 style="background:#e6c55d">Y</button></main><script>colors=['RED','GREEN','BLUE','GOLD'];n=0;l=3;active=0;timer=0;next=()=>{k=Math.random()*4|0;t.textContent=colors[k];s.textContent=n+'/12 | '+l+' lives';timer=setTimeout(()=>miss(),1400-n*45)};miss=()=>{l--;if(l<1){active=0;t.textContent='GAME OVER';s.textContent=n+'/12';start.hidden=false;start.textContent='RETRY';return}next()};start.onclick=()=>{clearTimeout(timer);n=0;l=3;active=1;start.hidden=true;next()};g.onclick=e=>{if(!active||e.target.dataset.k===undefined)return;clearTimeout(timer);if(+e.target.dataset.k==k)n++;else l--;if(n==12||l<1){active=0;t.textContent=n==12?'YOU WIN':'GAME OVER';start.hidden=false;start.textContent='RETRY'}else next()}</script>
